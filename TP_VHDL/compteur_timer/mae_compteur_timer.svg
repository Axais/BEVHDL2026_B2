<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <defs>
    <marker id="fleche" viewBox="0 0 10 10" refX="9.5" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="660" fill="#ffffff"/>

  <text x="600" y="42" text-anchor="middle" font-size="23" font-weight="bold" fill="#0f172a">compteur_timer — machine à état</text>
  <text x="600" y="66" text-anchor="middle" font-size="13" fill="#64748b">Machine de Moore : go_compte ne dépend que de l'état présent. Le compteur est incrémenté quand go_compte = '1'.</text>

  <!-- ============ transitions ============ -->

  <!-- attente -> tempo -->
  <line x1="365" y1="210" x2="810" y2="210" stroke="#334155" stroke-width="2.2" marker-end="url(#fleche)"/>
  <text x="588" y="236" text-anchor="middle" font-size="14" fill="#0f172a">bouton = '0'</text>
  <text x="588" y="254" text-anchor="middle" font-size="12" fill="#64748b" font-style="italic">appui détecté, le timer démarre</text>

  <!-- tempo -> compte -->
  <line x1="900" y1="262" x2="900" y2="413" stroke="#334155" stroke-width="2.2" marker-end="url(#fleche)"/>
  <text x="880" y="331" text-anchor="end" font-size="14" fill="#0f172a">fin_timer = '1'</text>
  <text x="880" y="349" text-anchor="end" font-size="12" fill="#64748b" font-style="italic">20 ms écoulées, bouton toujours enfoncé</text>

  <!-- compte -> relachement -->
  <line x1="815" y1="470" x2="370" y2="470" stroke="#334155" stroke-width="2.2" marker-end="url(#fleche)"/>
  <text x="592" y="452" text-anchor="middle" font-size="14" fill="#0f172a">inconditionnel</text>
  <text x="592" y="494" text-anchor="middle" font-size="12" fill="#64748b" font-style="italic">l'état ne dure qu'un seul coup d'horloge</text>

  <!-- relachement -> attente -->
  <line x1="280" y1="418" x2="280" y2="267" stroke="#334155" stroke-width="2.2" marker-end="url(#fleche)"/>
  <text x="300" y="335" text-anchor="start" font-size="14" fill="#0f172a">bouton = '1'</text>
  <text x="300" y="353" text-anchor="start" font-size="12" fill="#64748b" font-style="italic">bouton relâché, prêt pour l'appui suivant</text>

  <!-- tempo -> attente (appui trop court) -->
  <path d="M 845,168 Q 590,88 335,168" fill="none" stroke="#b45309" stroke-width="2.2" stroke-dasharray="7 4" marker-end="url(#fleche)"/>
  <text x="590" y="94" text-anchor="middle" font-size="14" fill="#b45309">bouton = '1'</text>
  <text x="590" y="112" text-anchor="middle" font-size="12" fill="#b45309" font-style="italic">relâché avant les 20 ms : appui NON comptabilisé</text>

  <!-- ============ boucles sur place ============ -->

  <path d="M 200,177 C 148,132 138,252 200,243" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#fleche)"/>
  <text x="132" y="206" text-anchor="end" font-size="13" fill="#0f172a">bouton = '1'</text>
  <text x="132" y="224" text-anchor="end" font-size="11" fill="#64748b" font-style="italic">rien ne se passe</text>

  <path d="M 980,177 C 1032,132 1042,252 980,243" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#fleche)"/>
  <text x="1048" y="199" text-anchor="start" font-size="13" fill="#0f172a">bouton = '0'</text>
  <text x="1048" y="217" text-anchor="start" font-size="13" fill="#0f172a">et fin_timer = '0'</text>
  <text x="1048" y="235" text-anchor="start" font-size="11" fill="#64748b" font-style="italic">le timer compte</text>

  <path d="M 200,437 C 148,392 138,512 200,503" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#fleche)"/>
  <text x="132" y="466" text-anchor="end" font-size="13" fill="#0f172a">bouton = '0'</text>
  <text x="132" y="484" text-anchor="end" font-size="11" fill="#64748b" font-style="italic">bouton encore tenu</text>

  <!-- ============ reset ============ -->
  <circle cx="150" cy="330" r="6" fill="#334155"/>
  <line x1="155" y1="326" x2="230" y2="254" stroke="#334155" stroke-width="2.2" marker-end="url(#fleche)"/>
  <text x="118" y="356" text-anchor="start" font-size="13" fill="#0f172a">rst = '0'</text>
  <text x="118" y="374" text-anchor="start" font-size="11" fill="#64748b" font-style="italic">reset asynchrone</text>

  <!-- ============ états ============ -->

  <ellipse cx="280" cy="210" rx="85" ry="52" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.4"/>
  <text x="280" y="205" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">attente</text>
  <text x="280" y="228" text-anchor="middle" font-size="12" fill="#1e40af">go_compte = '0'</text>

  <ellipse cx="900" cy="210" rx="85" ry="52" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.4"/>
  <text x="900" y="205" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">tempo</text>
  <text x="900" y="228" text-anchor="middle" font-size="12" fill="#1e40af">go_compte = '0'</text>

  <ellipse cx="900" cy="470" rx="85" ry="52" fill="#fde68a" stroke="#b45309" stroke-width="2.8"/>
  <text x="900" y="465" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">compte</text>
  <text x="900" y="488" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">go_compte = '1'</text>

  <ellipse cx="280" cy="470" rx="85" ry="52" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.4"/>
  <text x="280" y="465" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">relachement</text>
  <text x="280" y="488" text-anchor="middle" font-size="12" fill="#1e40af">go_compte = '0'</text>

  <!-- ============ encadré timer ============ -->
  <rect x="420" y="548" width="500" height="86" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="440" y="573" font-size="13" font-weight="bold" fill="#0f172a">Timer (20 ms)</text>
  <text x="440" y="594" font-size="12" fill="#334155">timer s'incrémente uniquement dans l'état tempo, sinon il est remis à 0.</text>
  <text x="440" y="613" font-size="12" fill="#334155">fin_timer = '1' quand timer = max_timer (1 000 000 coups d'horloge à 50 MHz).</text>

</svg>
